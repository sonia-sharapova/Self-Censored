# /etc/nginx/sites-available/self-censored.soniapolis.com
# certbot --nginx adds the HTTPS server block and redirect on top of this
server {
    listen 80;
    listen [::]:80;
    server_name self-censored.soniapolis.com;

    access_log /var/log/nginx/self-censored.access.log;
    error_log  /var/log/nginx/self-censored.error.log;

    gzip on;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css;

    location / {
        proxy_pass http://127.0.0.1:3917;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
